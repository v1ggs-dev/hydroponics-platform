services:
  # ==========================================
  # PostgreSQL Database for Telemetry & State
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: hydro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hydro_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hydro_pass}
      POSTGRES_DB: ${POSTGRES_DB:-hydroponics_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hydro_user} -d ${POSTGRES_DB:-hydroponics_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Mosquitto MQTT Message Broker
  # ==========================================
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: hydro_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_log:
    driver: local
