name: Hydroponics CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------------------
  # 1. Validation & Test Job
  # ----------------------------------------------------------------------------
  validate:
    name: Build & Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Validate Backend Build
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Validate Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      - name: Validate AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai/requirements.txt

  # ----------------------------------------------------------------------------
  # 2. Automated Server Deployment Job (Runs only on push to main)
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Private Cloud Server
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to Server
        uses: appleboy/ssh-action@v1.0.3
        if: env.SERVER_HOST != ''
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_PORT: ${{ secrets.SERVER_SSH_PORT || 22 }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script: |
            cd ~/hydroponics-platform || cd /var/www/hydroponics-platform
            git pull origin main
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
            docker system prune -f
